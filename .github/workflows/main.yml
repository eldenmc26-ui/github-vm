name: MacOS-VNC-Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Install Tailscale (manual safe install)
        run: |
          curl -L -o tailscale.pkg https://pkgs.tailscale.com/stable/tailscale-macos-universal.pkg
          sudo installer -pkg tailscale.pkg -target /

      - name: Verify install
        run: |
          ls -la /Applications/Tailscale.app || true
          ls -la /usr/sbin/tailscaled || true
          which tailscale || true

      - name: Start Tailscale daemon
        run: |
          sudo /usr/sbin/tailscaled --tun=userspace-networking &

      - name: Connect to Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo /usr/bin/tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-mac-vnc

      - name: Enable Remote Login (SSH)
        run: |
          sudo systemsetup -setremotelogin on

      - name: Enable VNC (Screen Sharing)
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -users runneradmin -privs -all

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent

      - name: Show IP
        run: |
          /usr/bin/tailscale ip -4 || true

      - name: Keep alive
        run: |
          echo "READY"
          sleep 14400
