name: MacOS-VNC-Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Find Tailscale binary
        run: |
          which tailscale || true
          ls -la /usr/local/bin || true
          ls -la /opt/homebrew/bin || true

      - name: Start Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo /usr/local/bin/tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-mac-vnc || \
          sudo /opt/homebrew/bin/tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-mac-vnc

      - name: Enable Remote Login (SSH)
        run: |
          sudo systemsetup -setremotelogin on

      - name: Enable VNC (Screen Sharing)
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -users runneradmin -privs -all

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent

      - name: Show Tailscale IP
        run: |
          /usr/local/bin/tailscale ip -4 || /opt/homebrew/bin/tailscale ip -4 || true

      - name: Keep VM alive
        run: |
          echo "Mac ready on Tailscale network"
          sleep 14400
