name: MacOS-Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Install Tailscale
        run: |
          brew update
          brew install tailscale

      - name: Locate Tailscale binary
        id: ts
        run: |
          echo "Checking tailscale path..."
          which tailscale || true
          find /usr -name tailscale 2>/dev/null || true
          find /opt -name tailscale 2>/dev/null || true

      - name: Start Tailscale daemon
        run: |
          sudo tailscaled --tun=userspace-networking &
          sleep 5

      - name: Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-mac-vnc

      - name: Show IP (SAFE)
        run: |
          tailscale ip -4 || true

      - name: Keep alive
        run: |
          sleep 14400
