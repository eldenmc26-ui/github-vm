name: MacOS-VNC-Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download Tailscale
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o tailscale.pkg \
            https://pkgs.tailscale.com/stable/tailscale-macos-universal.pkg

      - name: Install Tailscale
        run: |
          sudo installer -pkg tailscale.pkg -target /

      - name: Start Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo /usr/bin/tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-mac-vnc

      - name: Enable SSH
        run: |
          sudo systemsetup -setremotelogin on

      - name: Enable VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -users runneradmin -privs -all

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent

      - name: Show IP
        run: |
          /usr/bin/tailscale ip -4 || true

      - name: Keep Alive
        run: |
          sleep 14400
