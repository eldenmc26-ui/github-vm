name: MacOS-Tailscale-Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Install Tailscale
        run: |
          brew update
          brew install tailscale

      - name: Start Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo tailscaled --tun=userspace-networking &
          sleep 5
          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=github-mac-vnc

      - name: Show IP
        run: |
          /usr/bin/tailscale ip -4

      - name: Enable SSH (system only)
        run: |
          sudo systemsetup -setremotelogin on

      - name: Keep alive
        run: |
          sleep 14400
